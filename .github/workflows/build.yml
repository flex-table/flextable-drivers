# Build native-driver bundles - GENERIC + INCREMENTAL.
#
# Dispatch picks ONE engine (`namespace`) and which `targets` to build, so adding
# a new engine or backfilling one target NEVER rebuilds what already exists. The
# `plan` job derives the matrix from config/<namespace>.json (skipping any target
# whose url/sha is still TODO); the `build` job runs the reusable build-bundle.yml
# once per selected target on its own OS runner.
#
# Add a new engine: drop a config/<engine>.json + (if its sourcing differs) extend
# the bundle scripts, then dispatch namespace=<engine>. Existing engines' bundles
# are untouched here, and the app-repo publish merges non-destructively
# (build_manifest.py --merge-from-url), so their manifest leaves survive too.
name: build

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Engine namespace (matches config/<namespace>.json), e.g. oracle-instantclient"
        required: true
        type: string
      targets:
        description: "Comma list of <os>-<arch> to build, or 'all' for every pinned target"
        required: false
        default: "all"
        type: string
      major:
        description: "Major to build (config/<namespace>.json -> majors.<major>). Blank = the config's defaultMajor."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        shell: bash
        env:
          NS: ${{ inputs.namespace }}
          WANT: ${{ inputs.targets }}
          MAJOR_IN: ${{ inputs.major }}
        run: |
          python3 - <<'PY'
          import json, os
          ns, want = os.environ["NS"], os.environ["WANT"].strip()
          cfg = json.load(open(f"config/{ns}.json"))
          # A namespace may ship SEVERAL majors (Oracle: 11/19/23), each with its own pinned
          # targets under `majors.<major>.targets`. The original single-major shape (flat
          # `major` + `targets`) is still accepted so other namespaces need no migration.
          req = os.environ.get("MAJOR_IN", "").strip()
          if "majors" in cfg:
              major = req or str(cfg["defaultMajor"])
              if major not in cfg["majors"]:
                  raise SystemExit(f"major {major} not in config/{ns}.json (have: {sorted(cfg['majors'])})")
              targets = cfg["majors"][major]["targets"]
          else:
              major = str(cfg["major"])
              if req and req != major:
                  raise SystemExit(f"config/{ns}.json pins major {major}; cannot build {req}")
              targets = cfg["targets"]
          # os -> GitHub-HOSTED runner. This repo is PUBLIC, so hosted macOS is FREE
          # (macos-14 = Apple Silicon/arm64, macos-13 = Intel/x86_64) - no self-hosted runner.
          RUNNER = {"macos-arm64":"macos-14","macos-x86_64":"macos-13",
                    "linux-x86_64":"ubuntu-latest","windows-x86_64":"windows-latest"}
          picked = [t.strip() for t in want.split(",")] if want and want!="all" else list(targets)
          incl=[]
          for t in picked:
              spec = targets.get(t)
              if not spec: raise SystemExit(f"target {t} not in config/{ns}.json majors.{major}")
              if "TODO" in (spec["url"]+spec["sha256"]):
                  print(f"::warning::skipping {ns} {t} - url/sha not pinned yet", flush=True); continue
              osname, arch = t.rsplit("-",1)
              incl.append({"namespace":ns,"major":major,"os":osname,"arch":arch,"runner":RUNNER[t]})
          if not incl: raise SystemExit("no pinned targets to build")
          # matrix -> GITHUB_OUTPUT via the file API; warnings above go to stdout (the log).
          # (Redirecting the whole script to $GITHUB_OUTPUT would push a ::warning:: line
          # into it and fail with "Invalid format".)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": incl}) + "\n")
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-bundle.yml
    with:
      namespace: ${{ matrix.namespace }}
      major: ${{ matrix.major }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
